<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Colorless: a trading-card-game playmat with a deck builder, sandbox and online play, rendered in LÖVE.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Colorless — Home</title>
  <link rel="stylesheet" href="/love/host.css">
</head>
<body>
  <main>
    <h1 id="page-heading" class="sr-only">Colorless</h1>
    <canvas id="canvas" width="1280" height="800" tabindex="0" role="application" aria-roledescription="game" aria-busy="true" aria-label="Colorless is loading" aria-describedby="instructions"></canvas>
    <div id="loading">
      <div id="loading-progress" role="progressbar" aria-label="Loading Colorless" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
      <span id="status" class="sr-only" role="status">Loading the menu…</span>
    </div>
    <p id="instructions" class="sr-only"></p>
    <div id="announcement" role="status" class="sr-only"></div>
    <nav class="accessible-menu" aria-label="Main menu links">
      <a id="home-link" href="/" hidden>Home</a><a id="sandbox-link" href="/sandbox">Sandbox</a><a id="online-link" href="/online">Online</a><a id="decks-link" href="/decks">Decks</a><a id="account-link" href="/?account" aria-haspopup="dialog">Account</a><a id="settings-link" href="/?settings" aria-haspopup="dialog" aria-expanded="false">Settings</a>
    </nav>
  </main>
  <!-- Generated by `bun run build:lua` into public/love/. host.js defines
       Module before the love.js runtime and its game package load. -->
  <script src="/love/host.js"></script>
  <script type="module" src="/src/lua/bridge.ts"></script>
  <script src="/love/game.js"></script>
  <script src="/love/love.js"></script>
</body>
</html>
