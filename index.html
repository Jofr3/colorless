<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Colorless: a trading-card-game playmat with a deck builder, sandbox and online play, rendered in LÖVE.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <!-- Link previews. vite.config.ts makes og:url and og:image absolute at build. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Colorless">
  <meta property="og:title" content="Colorless">
  <meta property="og:description" content="A trading-card-game playmat with a deck builder, sandbox and online play.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Colorless wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Colorless — Home</title>
  <link rel="stylesheet" href="/love/host.css">
  <noscript><link rel="stylesheet" href="/noscript.css"></noscript>
</head>
<body>
  <main>
    <h1 id="page-heading" class="sr-only">Colorless</h1>
    <canvas id="canvas" width="1280" height="800" tabindex="0" role="application" aria-roledescription="game" aria-busy="true" aria-label="Colorless is loading" aria-describedby="instructions"></canvas>
    <div id="loading">
      <div id="loading-progress" role="progressbar" aria-label="Loading Colorless" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
      <span id="status" class="sr-only" role="status">Loading the menu…</span>
    </div>
    <noscript><p class="noscript">Colorless needs JavaScript to run. Turn it on and reload the page.</p></noscript>
    <p id="instructions" class="sr-only"></p>
    <div id="announcement" role="status" class="sr-only"></div>
    <nav class="accessible-menu" aria-label="Main menu links">
      <a id="home-link" href="/" hidden>Home</a><a id="sandbox-link" href="/sandbox">Sandbox</a><a id="online-link" href="/online">Online</a><a id="decks-link" href="/decks">Decks</a><a id="account-link" href="/?account" aria-haspopup="dialog">Account</a><a id="settings-link" href="/?settings" aria-haspopup="dialog" aria-expanded="false">Settings</a><a id="credits-link" href="/love/THIRD-PARTY-NOTICES.txt">Credits</a>
    </nav>
  </main>
  <!-- Generated by `bun run build:lua` into public/love/. host.js defines
       Module before the love.js runtime and its game package load. -->
  <script src="/love/host.js"></script>
  <script type="module" src="/src/lua/bridge.ts"></script>
  <script src="/love/game.js"></script>
  <script src="/love/love.js"></script>
</body>
</html>
