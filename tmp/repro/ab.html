<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0e0e14; }
  .panel {
    position: relative; display: inline-block; width: 400px; height: 480px;
    vertical-align: top; overflow: hidden; isolation: isolate;
    /* a blue glow on the left half, red on the right — like the home page */
    background:
      radial-gradient(ellipse 70% 80% at 25% 50%, rgba(38,149,255,0.22) 0%, rgba(38,149,255,0.10) 40%, rgba(38,149,255,0) 75%),
      radial-gradient(ellipse 70% 80% at 80% 30%, rgba(255,52,86,0.20) 0%, rgba(255,52,86,0.09) 40%, rgba(255,52,86,0) 75%);
  }
  .dots {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.34;
    background-image: radial-gradient(circle, rgba(245,250,255,0.55) 1px, transparent 1.6px);
    background-position: center; background-size: 18px 18px;
  }
  .screen .dots { mix-blend-mode: screen; }
  .tag { position:absolute; top:8px; left:10px; z-index:2; color:#fff; font:13px sans-serif; }
</style>
</head>
<body>
  <div class="panel screen"><div class="tag">SCREEN (current)</div><div class="dots"></div></div>
  <div class="panel normal"><div class="tag">NORMAL (proposed)</div><div class="dots"></div></div>
</body>
</html>
