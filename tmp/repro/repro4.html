<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* glow on <body>, exactly like index.css (OUTSIDE the backdrop) */
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 52% 96% at 8% 50%, rgba(38,149,255,0.5), rgba(38,149,255,0) 72%),
      radial-gradient(ellipse 52% 96% at 92% 50%, rgba(255,52,86,0.45), rgba(255,52,86,0) 72%),
      #0e0e14;
    background-repeat: no-repeat;
    font-family: sans-serif;
  }

  /* .app-backdrop WITHOUT isolation (the fix). position:relative + overflow only. */
  .app-backdrop {
    position: relative; width: 100%; min-height: 100vh; overflow: hidden;
    --cursor-x: 50%; --cursor-y: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .app-backdrop::before, .app-backdrop::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(circle, rgba(245,250,255,0.26) 1px, transparent 1.35px);
    background-position: center; background-size: 24px 24px;
  }
  .app-backdrop::before { opacity: 0.6; }       /* simplified: reveal everywhere */
  .app-backdrop::after {
    inset: auto; left: 0; top: 0; width: 300px; height: 300px; opacity: 0.62;
    transform: translate(calc(var(--cursor-x) - 150px), calc(var(--cursor-y) - 150px));
    background-image: radial-gradient(circle, rgba(245,250,255,0.55) 1px, transparent 1.35px);
    -webkit-mask-image: radial-gradient(circle 150px at 50% 50%, black 0%, rgba(0,0,0,0.82) 38%, transparent 74%);
    mask-image: radial-gradient(circle 150px at 50% 50%, black 0%, rgba(0,0,0,0.82) 38%, transparent 74%);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 380px; }
  .card {
    aspect-ratio: 1; border-radius: 16px;
    background: rgba(255,255,255,0.045);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="app-backdrop" style="--cursor-x: 50vw; --cursor-y: 50vh;">
    <div class="grid">
      <div class="card">Simulator</div><div class="card">Online</div>
      <div class="card">Decks</div><div class="card">Settings</div>
    </div>
  </div>
</body>
</html>
