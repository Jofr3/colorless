<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0e0e14; }
  .wrap { position: relative; width: 800px; height: 220px; isolation: isolate; }

  .stripes {
    position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: repeating-linear-gradient(45deg, #fff 0 3px, transparent 3px 9px);
  }
  .blend   { mix-blend-mode: screen; }
  .promote { transform: translate3d(0,0,0); will-change: transform; }

  .card {
    position: absolute; top: 60px; left: 0; width: 100%; height: 100px;
    background: rgba(255,255,255,0.045);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid rgba(255,255,255,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-family: sans-serif; font-size: 13px;
    display:flex; align-items:center; justify-content:center;
  }
  .label { color:#8ff; font-family: sans-serif; font-size: 12px; padding: 2px 6px; }
  .row { margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="row"><span class="label">A: plain stripes (control)</span>
    <div class="wrap"><div class="stripes"></div><div class="card">blur card — is the strip behind me blurred?</div></div></div>

  <div class="row"><span class="label">B: stripes + mix-blend-mode:screen</span>
    <div class="wrap"><div class="stripes blend"></div><div class="card">blur card</div></div></div>

  <div class="row"><span class="label">C: stripes + will-change/translate3d (promoted layer)</span>
    <div class="wrap"><div class="stripes promote"></div><div class="card">blur card</div></div></div>

  <div class="row"><span class="label">D: stripes + blend + promoted (like ::after spotlight)</span>
    <div class="wrap"><div class="stripes blend promote"></div><div class="card">blur card</div></div></div>
</body>
</html>
