# Weekly update PRs for npm dependencies (bun.lock and every workspace's
# package.json: the bun ecosystem at / reads the root's `workspaces`) and for
# the SHA-pinned GitHub Actions. Updates arrive grouped so coupled bumps move
# together; the monthly routine in docs/conventions.md ("Dependencies") says
# how each group is gated and merged (dependency audit PRC2, DEP-P1).
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dev updates wait a week after release. The five packages that ship in the
    # Worker get theirs at once, so a security patch is not held back
    # (bunfig.toml keeps its own 3-day gate for manual installs). Security
    # updates never wait.
    cooldown:
      default-days: 7
      exclude:
        - hono
        - zod
        - drizzle-orm
        - "@hono/zod-validator"
        - "@noble/ciphers"
    # Majors that need a go/no-go branch of their own (dependency audit §5).
    ignore:
      # A typescript major (8) gets its own go/no-go branch, as 7 did (DEP-P5).
      # The mutation scripts parse with @typescript/typescript6 until TS 7.1's
      # compiler API is stable.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Decision 8: @types/node follows the pinned Node line (.node-version,
      # 22 LTS), not the newest Node; the move to 24 is planned for Q1 2027.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A Biome major (3) gets its own go/no-go branch, as 2 did (DEP-P7):
      # `biome migrate --write`, then biome ci --error-on-warnings,
      # lint-coverage, the generators' --check and a mutant sample.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      # A vitest major (6) gets its own go/no-go branch, as 5 did (DEP-P6):
      # check its cache paths (ci.yml) and that a seeded mutant sample matches.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group that matches it.
    groups:
      # wrangler, its miniflare and the Workers types move as one, or the lock
      # gains a second workerd (scripts/lock-check.ts). CI skips build:lua
      # and e2e, so this group is merged after those run locally.
      cloudflare:
        patterns:
          - wrangler
          - miniflare
          - "@cloudflare/*"
      vite:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
      types:
        patterns:
          - "@types/*"
      # What ships in the Worker: merged weekly, as it arrives.
      production:
        patterns:
          - hono
          - zod
          - drizzle-orm
          - "@hono/zod-validator"
          - "@noble/ciphers"
        update-types: [minor, patch]
      # Every other (dev) package, merged in the monthly routine. Groups'
      # `dependency-type` is not supported for bun, so this catches by name:
      # the shipped five matched `production` first. A major that no group
      # takes comes as a PR of its own.
      dev:
        patterns:
          - "*"
        update-types: [minor, patch]

  # `/` covers .github/workflows only; the composite actions under
  # .github/actions pin actions too, and are scanned only when listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
