name: Dependency report

# A weekly look at the whole dependency tree, report only: it never fails.
# CI's gate audits only what the Workers ship (`audit --prod`), and GitHub's
# dependency graph does not read bun.lock, so Dependabot raises no alerts for
# transitive or dev packages (dependency audit PRC5). This job puts the full
# `bun audit` and `bun outdated` in the run summary for the monthly upgrade
# routine (docs/conventions.md, "Dependencies"); `bun run deps:check` is the
# local version of the same report.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit and outdated
        run: |
          {
            echo "## bun audit (whole tree, dev included)"
            echo '```'
            bun audit 2>&1 || true
            echo '```'
            echo "## bun outdated (every workspace)"
            echo '```'
            bun outdated -r 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
