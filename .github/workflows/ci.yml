name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository. Actions are pinned to commit SHAs (the tag in
# the comment); .github/dependabot.yml proposes the bumps.
permissions:
  contents: read

# The same named steps as `bun run check`, split into parallel jobs: static, lua
# (with the bundle) and test. Lua tests needing Balatro's source (not in this
# repository) are skipped, and the bundle is built without the Lua package for
# the same reason. Every job has a timeout, so a hung test fails in minutes
# rather than GitHub's default six hours.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No bun-version pin here: setup-bun reads .bun-version for a
      # reproducible toolchain (matches the packageManager field too).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # tsc, vite, vitest, wrangler and biome start with `#!/usr/bin/env node`,
      # so `bun run` executes them under Node. .node-version pins the line
      # (22 LTS) rather than taking whatever the runner image ships (PRC4).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Cache Bun's global install cache (keyed on the lockfile) so unchanged
      # deps don't re-download each run. Not node_modules — bun links from cache.
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Known advisories in what the Workers ship (hono, zod, drizzle-orm and
      # their dependencies). The dev tree is reported, not gated, by
      # deps-report.yml and `bun run deps:check`: GitHub's alerts do not read
      # bun.lock. A new advisory with no fix yet gets a dated
      # `--ignore=GHSA-…` here.
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=moderate

      # The previous run's build info and engine and schema declarations, so
      # `tsc -b` re-checks only what changed. Each run saves under its own sha.
      - name: Cache TypeScript build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/*.tsbuildinfo
            packages/*/dist
            !**/node_modules/**
          key: ${{ runner.os }}-tsc7-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc7-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-tsc7-

      # `tsc -b` skips a project whose build info is newer than its sources.
      # Backdating the restored files makes every project compare its sources
      # by content hash, so a change the cache predates is never missed.
      - name: Backdate the TypeScript build
        run: >-
          find . -name node_modules -prune -o
          \( -name '*.tsbuildinfo' -o -path './packages/*/dist/*' \)
          -exec touch -d 2000-01-01 {} +

      # The mutant binding gate's verdicts from the previous run. The gate
      # discards a cache stamped by another version of itself.
      - name: Cache binding-gate verdicts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/binding-gate-cache.json
          key: ${{ runner.os }}-binding-gate-${{ hashFiles('scripts/mutation/binding-gate.ts', 'bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-binding-gate-${{ hashFiles('scripts/mutation/binding-gate.ts', 'bun.lock') }}-

      - name: Static checks
        run: bun run check:static

  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # love.js runs PUC Lua 5.1, so the suite runs under it: 5.2 would accept
      # syntax (`goto`) and APIs (`table.unpack`) that break the shipped game.
      - name: Lua tests
        run: |
          sudo apt-get install -y lua5.1
          LUA=lua5.1 bun run test:lua

      - name: Bundle
        run: LOVE_VERSIONS_OPTIONAL=1 bunx vite build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vitest's module cache never prunes itself, so its key rotates weekly.
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Transformed modules (keyed by content hash) and vitest's results,
      # which order the next run's files longest first.
      - name: Cache vitest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.experimental-vitest-cache
            node_modules/.vite/vitest
          key: ${{ runner.os }}-vitest-${{ hashFiles('bun.lock') }}-${{ steps.week.outputs.week }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-vitest-${{ hashFiles('bun.lock') }}-${{ steps.week.outputs.week }}-

      # The runner has two cores; vitest alone would use one worker.
      - name: Test
        run: bun run check:test --maxWorkers=2

  # Precheck proves mutant anchors are unique; this proves a slice of the killers
  # still kill: rows on the files this push or PR changed, plus a random draw
  # seeded by the commit.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The sample diffs names against the base, which needs history but no
      # old file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The harness's own vitest module cache (it drops what each mutant adds).
      - name: Cache the harness's vitest modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/mutation-vitest-cache
          key: ${{ runner.os }}-mutation-vitest-${{ hashFiles('bun.lock') }}-${{ steps.week.outputs.week }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-mutation-vitest-${{ hashFiles('bun.lock') }}-${{ steps.week.outputs.week }}-

      # Rows killed by a Lua suite run `bun scripts/test-lua.ts`, which needs the
      # interpreter: without it every such row reports "baseline is RED" and fails
      # the job (main was red from 2026-10-29 to 2026-11-09; dependency audit PRC1).
      - name: Install Lua
        run: sudo apt-get install -y lua5.1

      - name: Mutant sample
        run: bun scripts/mutation/sample.ts --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  # Engine timings for the record, never a gate: shared runners are too noisy.
  # The fingerprint line shows whether a change altered play.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Engine benchmark
        run: |
          bun run bench --node | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
